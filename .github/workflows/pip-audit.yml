# Fail the build if requirements.txt has known vulnerabilities (CVE).
# Complements Dependabot: Dependabot opens PRs; this enforces "no known vulns" on merge.
name: Dependency audit (pip-audit)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'requirements.txt'
      - '.github/workflows/pip-audit.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'requirements.txt'
      - '.github/workflows/pip-audit.yml'

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --ignore-vuln CVE-2025-62727 --ignore-vuln CVE-2025-71176 --ignore-vuln CVE-2025-69872
          # CVE-2025-62727: starlette 0.49.1 required; FastAPI does not yet support starlette>=0.49. Remove this ignore when upgrading FastAPI.
          # CVE-2025-71176: pytest 9.x required; stay on 7.4.3 until test suite is validated on pytest 9.
          # CVE-2025-69872: diskcache via instructor; no fix version published yet.
        # Exits non-zero if any other known vulnerability is found
